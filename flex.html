<html lang="en">
<head>
    <meta charset="UTF-8">

    <title>Document</title>
    <style>


        body{
            background-color: #FFFFFF;
            height: 100vh;
            width: 100vw;
            margin: 0;
            padding:0;


        }
     #navbar{
        height: 40px;
        width: 100%;
        background-color:#496ADC;

     }
     .leftNav{
        /* border: 1px solid black; */
        height: 100%;
        width: 90%;
        /* background-color: black; */
        display: flex;
        align-items: center;

        /* we used this line anchor with space givene equally */
        /* justify-content:space-evenly; */

     }
     .rightNav{
        height: 100%;
        width: 10%;
        /* last step= background-color: orange; */

        align-items: center;

     }

        height: 50px;

        /* flex-grow: 1; */

        font-size: x-large;
        display: flex;
        justify-content: center;
        align-items: center;

        
        

     }

        flex-grow: 2;
     } */

    </div>
    <div class="mainBox">
