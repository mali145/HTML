<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grid</title>
    <style>
      *{
            margin: 0;
            padding: 0;
         }
        body{

            
            height: 100vh;
            width: 100vw;
            display: flex;
            justify-content: center;
            align-items: center;
        }
         /* (*)  - its contain all element and defining the  properties of all element */

         
         .container{
            height: 80%;
            width: 80%;
            border: 1px solid black;
            display: grid;
            /* grid-template-columns: 150px 150px 150px; */
            /* grid-template-columns: repeat(3, 1fr); */
            grid-template-columns: 200px repeat(2,1fr);
            grid-template-rows: 100px 1fr 100px;
            /* grid-template-rows: 1fr 1fr 1fr ; */
            /* gap:10px;
            row-gap: 10px;
            column-gap: 20px; */
    
    }
         .box{
            /* height: 100px;
            width: 100px; */
            border: 1px solid blue;


         }
     

            .box1 {
                grid-column: 1 / 3;
            }

            .box4 {
                grid-column: 1;
                grid-row: 3 / 5;
            }
        
        @media (max-width: 600px) {
            .box{
                background-color: rgb(151, 165, 42);
            }
            
        }

        @media (max-width: 300px) {
            .box{
                background-color: rgb(128, 42, 165);
            }
            
        }

    







    </style>
</head>
<body>
    <div class="container">
          <div class="box box1">1</div>
          <div class="box box2">2</div>
          <div class="box box3">3</div>
          <div class="box box4">4</div>
          <div class="box">5</div>
          <div class="box">6</div>
         <div class="box">7</div>
         <div class="box">8</div>
         <div class="box">9</div>
         
         
         
         




          


    </div>

    
</body>
</html>
