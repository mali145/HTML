<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>


/*  create a variables */
:root{
    --white-circle:white;
    --red-circle:red;
    --black-circle:black;
}





    body{
        background-color: peachpuff;
        height: 100vh;
        width: 100vw;
        margin:0;
        padding: 0;
        display: flex;
        justify-content: center;
        align-items: center;
    }
    .circle{
        height: 30rem;
        width: 30rem;
        background-color: red;
        border-radius: 50%;
        display: flex;
        justify-content: center;
        align-items: center;
    }
    .circleTwo{
        height: 25rem;
        width: 25rem;
        background-color: black;
        border-radius: 50%;
        display: flex;
        justify-content: center;
        align-items:center ;


    }
    .circleThree{
        height: 10rem;
        width: 10rem;
        background-color:var(--white-circle);
        border-radius: 50%;

    }


    </style>
</head>
<body>
    <div class="circle">

        <div class="circleTwo">
            <div class="circleThree">

            </div>
        </div>
    </div>
    
    
</body>



</html>
